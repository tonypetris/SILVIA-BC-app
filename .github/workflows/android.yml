name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (preinstalled on the runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build web content (offline libraries, Android bridge)
        run: npm run build:www

      - name: Create Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#002841' --iconBackgroundColorDark '#002841' --splashBackgroundColor '#002841' --splashBackgroundColorDark '#002841'
          npm run android:prepare
          npx cap sync android

      - name: Release keystore (from repository secrets, if present)
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building a debug-signed APK (updates will need uninstall/reinstall)."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          V=$(node -p "require('../package.json').version")
          if [ "${{ steps.key.outputs.signed }}" = "yes" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../SILVIA-BC_${V}.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../SILVIA-BC_${V}_debug.apk"
          fi
          ls -la ../*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SILVIA-BC-apk
          path: '*.apk'

      - name: Publish on Releases (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" *.apk --title "S.I.L.V.I.A. + B + C ${GITHUB_REF_NAME#v}" --prerelease --notes "App Android di S.I.L.V.I.A. + B + C. Scarica il file .apk sul telefono e aprilo per installarlo (consenti l'installazione da questa origine)."
