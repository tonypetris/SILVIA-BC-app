name: Desktop Windows

on:
  push:
    branches: [desktop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Version
        run: echo "V=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"

      - name: Icons
        run: npx --yes @tauri-apps/cli@2 icon ../assets/icon-only.png

      - name: Build
        run: npx --yes @tauri-apps/cli@2 build

      - name: Collect
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe "out/SILVIA-BC_${V}_Windows_Setup.exe"
          cp src-tauri/target/release/bundle/msi/*.msi "out/SILVIA-BC_${V}_Windows.msi"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: SILVIA-BC-windows
          path: desktop/out/*

      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="desktop-v${V}"
          NOTES="S.I.L.V.I.A. + B + C ${V} per Windows (prova). SILVIA-BC_${V}_Windows_Setup.exe: installa per l'utente corrente, senza diritti di amministratore. In alternativa il .msi. Non firmato: al primo avvio Windows SmartScreen chiede «Ulteriori informazioni → Esegui comunque»."
          if gh release view "$T" >/dev/null 2>&1; then
            gh release upload "$T" out/* --clobber
          else
            gh release create "$T" out/* --prerelease --target "$GITHUB_SHA" --title "S.I.L.V.I.A. + B + C ${V} · Windows (prova)" --notes "$NOTES"
          fi
